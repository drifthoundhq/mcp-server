replicaCount: 1

image:
  repository: ghcr.io/drifthoundhq/mcp-server
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# DriftHound API configuration.
# drifthoundApiUrl and drifthoundApiToken are required.
drifthoundApiUrl: ""
drifthoundApiToken: ""

# Optionally reference an existing secret instead of creating one.
# The secret must have keys: DRIFTHOUND_API_URL and DRIFTHOUND_API_TOKEN.
existingSecret: ""

nodeSelector: {}
tolerations: []
affinity: {}
