{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drifthound-mcp-server.fullname" . }}
  labels:
    {{- include "drifthound-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  DRIFTHOUND_API_URL: {{ required "drifthoundApiUrl is required" .Values.drifthoundApiUrl | quote }}
  DRIFTHOUND_API_TOKEN: {{ required "drifthoundApiToken is required" .Values.drifthoundApiToken | quote }}
{{- end }}
